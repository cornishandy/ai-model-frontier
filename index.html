<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Model Frontier — Artificial Analysis data</title>
<!-- Home Screen app on iPhone -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="AI Frontier" />
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11, 11, 11, 0.1);
    --hover: rgba(11, 11, 11, 0.05);
    --accent: #2a78d6;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
    --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --other: #a8a69f;
    --e-minimal: #86b6ef; --e-low: #5598e7; --e-medium: #2a78d6; --e-default: #256abf;
    --e-high: #1c5cab; --e-xhigh: #104281; --e-max: #0d366b; --e-none: #c3c2b7;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.1); --hover: rgba(255, 255, 255, 0.06);
      --accent: #3987e5;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
      --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6b6a65;
      --e-minimal: #184f95; --e-low: #1c5cab; --e-medium: #2a78d6; --e-default: #3987e5;
      --e-high: #5598e7; --e-xhigh: #86b6ef; --e-max: #b7d3f6; --e-none: #52514e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.1); --hover: rgba(255, 255, 255, 0.06);
    --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6b6a65;
    --e-minimal: #184f95; --e-low: #1c5cab; --e-medium: #2a78d6; --e-default: #3987e5;
    --e-high: #5598e7; --e-xhigh: #86b6ef; --e-max: #b7d3f6; --e-none: #52514e;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--page); color: var(--ink);
    display: grid; grid-template-columns: 320px 1fr; grid-template-rows: auto 1fr;
  }
  header {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 16px;
    padding: 12px 20px; border-bottom: 1px solid var(--border); background: var(--surface);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  header .meta.error, .note.error { color: #e66767; }
  button:disabled { opacity: .5; cursor: default; }
  header .spacer { flex: 1; }

  button, select, input[type="text"], input[type="search"] {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { background: var(--hover); }
  button.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  select { padding-right: 4px; }
  label.inline { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); white-space: nowrap; }

  /* segmented control */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 10px; background: var(--surface); color: var(--ink-2); }
  .seg button + button { border-left: 1px solid var(--border); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  aside {
    border-right: 1px solid var(--border); background: var(--surface);
    overflow-y: auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 16px;
  }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; font-weight: 600; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row > select { flex: 1; min-width: 0; }

  .chips { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 12px;
    background: transparent; color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .chip.missing { opacity: .45; }

  #modelList { display: flex; flex-direction: column; gap: 10px; }
  .lab { border-top: 1px solid var(--border); padding-top: 8px; }
  .lab-head { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: 600; user-select: none; }
  .lab-head .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .lab-head .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12px; }
  .fam { display: grid; grid-template-columns: 1fr; gap: 3px; padding: 5px 0 5px 18px; }
  .fam-name { cursor: pointer; color: var(--ink-2); display: flex; gap: 6px; align-items: baseline; }
  .fam-name:hover { color: var(--ink); }
  .fam-name .score { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; margin-left: auto; }
  .fam-name .range { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; min-width: 78px; text-align: right; }
  .fam-name svg { flex: none; align-self: center; }
  .fam { opacity: .55; }
  .fam.any { opacity: 1; }
  .fam.any .fam-name { color: var(--ink); font-weight: 600; }
  .fam .chips { padding-left: 30px; }
  .fam .chip { font-size: 11px; padding: 1px 7px; }
  .dep { font-size: 10px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; }

  main { overflow-y: auto; padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
  .toolbar .group { display: flex; gap: 6px; align-items: center; }
  .toolbar .group > span { color: var(--muted); font-size: 12px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 16px 10px; position: relative; }
  .card h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .card .sub { color: var(--ink-2); font-size: 12px; margin: 2px 0 8px; }
  #chart { width: 100%; display: block; }
  #chart text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 4px 2px; color: var(--ink-2); font-size: 12px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .note { color: var(--muted); font-size: 12px; }

  #tooltip {
    position: fixed; pointer-events: none; z-index: 10; min-width: 220px; max-width: 320px;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 6px 24px rgba(0,0,0,.14); padding: 10px 12px; font-size: 12px; display: none;
  }
  #tooltip .t-name { font-weight: 600; font-size: 13px; display: flex; gap: 6px; align-items: center; }
  #tooltip .t-name i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  #tooltip .t-sub { color: var(--muted); margin-bottom: 6px; }
  #tooltip table { border-collapse: collapse; width: 100%; }
  #tooltip td { padding: 1px 0; color: var(--ink-2); }
  #tooltip td:last-child { text-align: right; color: var(--ink); font-variant-numeric: tabular-nums; }
  #tooltip tr.hl td { color: var(--ink); font-weight: 600; }
  #tooltip .t-foot { color: var(--muted); margin-top: 6px; font-size: 11px; }

  details.card summary { cursor: pointer; font-weight: 600; }
  table.data { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  table.data th, table.data td { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
  table.data th { color: var(--muted); font-weight: 500; cursor: pointer; user-select: none; white-space: nowrap; }
  table.data td.n { text-align: right; font-variant-numeric: tabular-nums; }
  table.data tr:hover td { background: var(--hover); }
  table.data i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }

  .mobile-only, .sheet-head, #scrim { display: none; }
  #tooltip.docked { left: 8px !important; right: 8px; top: auto !important; bottom: calc(10px + env(safe-area-inset-bottom)); max-width: none; }

  /* Phones: chart first, full width. Models live in a slide-up sheet; secondary controls behind "Options". */
  @media (max-width: 860px) {
    html, body { height: auto; }
    body { display: block; min-height: 100dvh; -webkit-text-size-adjust: 100%; }
    header {
      position: sticky; top: 0; z-index: 15; flex-wrap: wrap; gap: 6px 8px;
      padding: calc(8px + env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 8px max(12px, env(safe-area-inset-left));
    }
    header h1 { font-size: 15px; }
    header .meta { order: 10; flex-basis: 100%; font-size: 11px; }
    header button { padding: 6px 10px; }
    .desk-only { display: none !important; }
    .mobile-only { display: inline-flex; align-items: center; }
    button[aria-pressed="true"].mobile-only { background: var(--ink); color: var(--surface); }
    main { overflow: visible; padding: 10px max(8px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); gap: 10px; }
    .toolbar { gap: 8px 12px; }
    .toolbar.opts { display: none; }
    body.opts-open .toolbar.opts { display: flex; }
    .toolbar .group { flex-wrap: wrap; }
    .toolbar:first-child .group { flex: 1 1 100%; }
    .toolbar:first-child .group select { flex: 1; min-width: 0; }
    .seg button { padding: 6px 9px; }
    /* iOS zooms the page when focusing text smaller than 16px */
    select, input[type="text"], input[type="search"] { font-size: 16px; }
    .card { padding: 10px 10px 8px; border-radius: 8px; }
    .card h3 { font-size: 14px; }
    .card .sub { display: none; }
    #tableCard { overflow-x: auto; }

    aside {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 85dvh;
      border: 0; border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
      box-shadow: 0 -8px 30px rgba(0,0,0,.18); padding: 0 16px calc(40px + env(safe-area-inset-bottom));
      transform: translateY(105%); transition: transform .25s ease; overscroll-behavior: contain;
    }
    body.sheet-open aside { transform: none; }
    body.sheet-open { overflow: hidden; }
    .sheet-head {
      display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1;
      background: var(--surface); padding: 12px 0 10px; margin-bottom: -6px; border-bottom: 1px solid var(--border); font-weight: 600;
    }
    #scrim { position: fixed; inset: 0; z-index: 25; background: rgba(0,0,0,.3); }
    body.sheet-open #scrim { display: block; }
  }
</style>
</head>
<body>
<header>
  <h1>AI Model Frontier</h1>
  <span class="meta" id="dataMeta"></span>
  <span class="spacer"></span>
  <button id="openSheet" class="mobile-only">Models</button>
  <button id="toggleOpts" class="mobile-only" aria-pressed="false">Options</button>
  <button id="updateData" class="primary" title="Download the latest numbers from artificialanalysis.ai">Update<span class="desk-only"> data</span></button>
  <button id="downloadSvg" class="desk-only" title="Download chart as SVG">SVG</button>
  <button id="downloadPng" class="desk-only" title="Download chart as PNG">PNG</button>
  <div class="seg desk-only" id="themeSeg">
    <button data-v="system">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button>
  </div>
</header>

<aside id="sidebar">
  <div class="sheet-head"><span>Models &amp; saved sets</span><button id="closeSheet" class="primary">Done</button></div>
  <section>
    <h2>Saved sets</h2>
    <div class="row"><select id="setSelect"></select></div>
    <div class="row" style="margin-top:6px">
      <button id="setSave" class="primary">Save as…</button>
      <button id="setUpdate" title="Overwrite the selected saved set with the current view">Update</button>
      <button id="setDelete">Delete</button>
    </div>
    <div class="row" style="margin-top:6px">
      <button id="setExport" title="Download all saved sets as JSON">Export</button>
      <button id="setImport" title="Load saved sets from a JSON file">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden />
    </div>
    <div class="row" style="margin-top:8px">
      <span class="note" id="syncStatus" style="flex:1;min-width:0"></span>
      <button id="syncBtn" title="Saved sets and the current view sync between your devices through a private GitHub gist"></button>
    </div>
  </section>

  <section>
    <h2>Efforts shown</h2>
    <div class="chips" id="effortChips"></div>
    <div class="row" style="margin-top:6px">
      <span class="note">Selecting a model adds:</span>
      <select id="addEffort" title="Which effort variants get selected when you click a model family">
        <option value="all">all efforts</option>
        <option value="top">highest effort only</option>
      </select>
    </div>
  </section>

  <section>
    <h2>Models</h2>
    <div class="row">
      <input type="search" id="search" placeholder="Search models or labs…" style="flex:1;min-width:0" />
    </div>
    <div class="row" style="margin-top:6px">
      <button id="selDefaults" title="Artificial Analysis' default chart selection">AA defaults</button>
      <button id="selTop">Top 20</button>
      <button id="selNone">Clear</button>
    </div>
    <div class="row" style="margin-top:6px">
      <label class="inline"><input type="checkbox" id="showDeprecated" /> Include deprecated</label>
      <label class="inline"><input type="checkbox" id="openOnly" /> Open weights only</label>
    </div>
    <div class="note" id="selCount" style="margin-top:6px"></div>
    <div id="modelList" style="margin-top:8px"></div>
  </section>
</aside>

<main>
  <div class="toolbar">
    <div class="group"><span>Y</span><select id="ySel"></select><div class="seg" id="yScale"><button data-v="linear">Linear</button><button data-v="log">Log</button></div></div>
    <div class="group"><span>X</span><select id="xSel"></select><div class="seg" id="xScale"><button data-v="linear">Linear</button><button data-v="log">Log</button></div></div>
  </div>
  <div class="toolbar opts">
    <div class="group"><span>Pareto</span><div class="seg" id="paretoSeg"><button data-v="off">Off</button><button data-v="step">Step</button><button data-v="line">Line</button></div>
      <label class="inline" title="Compute the frontier over every model (matching the sidebar filters), and show frontier models you haven't selected as faint dots"><input type="checkbox" id="fullFrontier" /> all models</label></div>
    <div class="group"><span>Guides</span><div class="seg" id="guideSeg"><button data-v="hover">Hover</button><button data-v="pinned">Pinned</button><button data-v="frontier">Frontier</button><button data-v="all">All</button></div></div>
    <div class="group"><span>Labels</span><div class="seg" id="labelSeg"><button data-v="auto" title="Model names, plus effort tags on dots where they fit">Auto</button><button data-v="autoplus" title="Like Auto, and the top-effort dot also gets its effort level next to the model name">Auto+</button><button data-v="series">Models</button><button data-v="all">Every dot</button><button data-v="none">None</button></div></div>
    <div class="group"><span>Color</span><div class="seg" id="colorSeg"><button data-v="lab">Lab</button><button data-v="effort">Effort</button><button data-v="open">Open/closed</button></div></div>
    <div class="group"><span>Mark</span><select id="markSel" title="Put a mark on this effort level on every model's line"></select><div class="seg" id="markStyleSeg"><button data-v="hash">Hash</button><button data-v="ring">Ring</button><button data-v="square">Square</button></div></div>
    <label class="inline"><input type="checkbox" id="connect" /> Line through effort levels</label>
  </div>
  <div class="toolbar opts">
    <div class="group"><span>Grid</span><div class="seg" id="gridSeg"><button data-v="normal">Normal</button><button data-v="faint">Faint</button><button data-v="off">Off</button></div></div>
    <div class="group"><span>Axis text</span><div class="seg" id="axisSeg"><button data-v="normal">Normal</button><button data-v="faint">Faint</button></div></div>
  </div>

  <div class="card" id="chartCard">
    <h3 id="chartTitle"></h3>
    <div class="sub" id="chartSub"></div>
    <svg id="chart" role="img"></svg>
    <div class="legend" id="legend"></div>
    <div class="note" id="chartNote"></div>
    <div class="note" id="chartFoot" style="margin-top:6px"></div>
  </div>

  <details class="card" id="tableCard">
    <summary>Table view</summary>
    <table class="data" id="dataTable"></table>
  </details>
</main>

<div id="scrim"></div>
<div id="tooltip"></div>

<script src="aa-data.js"></script>
<script src="data/models.js"></script>
<script>
(() => {
  // Data: the copy built into the page, or a newer one saved by the "Update data" button.
  const DATA_KEY = 'aa-charts:data';
  // Saving must never stop the chart from updating: some browsers (private mode, in-app viewers, full storage)
  // throw on every write. Make room by dropping the cached data first; if that fails too, carry on unsaved.
  let storageWarned = false;
  function store(key, value) {
    try { localStorage.setItem(key, value); return true; } catch {}
    if (key !== DATA_KEY) try { localStorage.removeItem(DATA_KEY); localStorage.setItem(key, value); return true; } catch {}
    if (!storageWarned && key !== DATA_KEY) { storageWarned = true; setTimeout(() => showMeta('this browser won\'t let the page save settings, so changes last until you close it', true)); }
    return false;
  }
  const cachedData = (() => { try { return JSON.parse(localStorage.getItem(DATA_KEY)); } catch { return null; } })();
  let DATA = [window.AA_DATA, cachedData].filter((d) => d?.models?.length).sort((a, b) => b.scrapedAt.localeCompare(a.scrapedAt))[0];
  if (!DATA && !window.AAData) { document.body.innerHTML = '<p style="padding:40px;max-width:640px;line-height:1.6">No data loaded. This page reads <code>data/models.js</code> and <code>aa-data.js</code> from the folder next to it, so it only works when opened from the <code>aa-charts</code> folder.<br><br>Open <b>AI Model Frontier.html</b> instead — it has everything built in and works anywhere.</p>'; return; }
  DATA ||= { scrapedAt: new Date(0).toISOString(), models: [] }; // nothing yet: the auto-update below fetches it
  let ALL, BY_ID;

  // ---------- metrics ----------
  const pct = (v) => (v * 100).toFixed(1) + '%';
  const money = (v) => v === 0 ? '$0' : v >= 100 ? '$' + Math.round(v).toLocaleString() : v >= 1 ? '$' + v.toFixed(2).replace(/\.00$/, '') : '$' + +v.toPrecision(2);
  const compact = (v) => v >= 1e9 ? (v / 1e9).toFixed(1) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(v >= 1e7 ? 0 : 1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(v >= 1e4 ? 0 : 1) + 'K' : String(+v.toPrecision(3));
  const secs = (v) => v >= 100 ? Math.round(v) + 's' : v.toPrecision(2) + 's';
  const METRICS = {
    intelligence: { label: 'Intelligence Index', long: 'Artificial Analysis Intelligence Index', fmt: (v) => v.toFixed(1), better: 'high' },
    costPerTask: { label: 'Cost per task', long: 'Cost per Intelligence Index task (USD)', fmt: money, better: 'low', scale: 'linear' },
    costToRun: { label: 'Cost to run Intelligence Index', long: 'Cost to run the Intelligence Index (USD)', fmt: money, better: 'low', scale: 'log' },
    priceBlended: { label: 'Price (blended 3:1)', long: 'Price, USD per 1M tokens (3:1 input:output blend)', fmt: money, better: 'low', scale: 'log' },
    priceOutput: { label: 'Output price', long: 'Output price, USD per 1M tokens', fmt: money, better: 'low', scale: 'log' },
    outputTokens: { label: 'Tokens used for Intelligence Index', long: 'Output tokens used to run the Intelligence Index', fmt: compact, better: 'low', scale: 'log' },
    outputSpeed: { label: 'Output speed', long: 'Output speed (tokens per second)', fmt: (v) => Math.round(v) + ' t/s', better: 'high', scale: 'log' },
    ttft: { label: 'Time to first answer token', long: 'Time to first answer token (seconds)', fmt: secs, better: 'low', scale: 'log' },
    e2e: { label: 'End-to-end response time', long: 'End-to-end response time, 500 output tokens (seconds)', fmt: secs, better: 'low', scale: 'log' },
    timePerTask: { label: 'Time per index task', long: 'Average time per Intelligence Index task (seconds)', fmt: secs, better: 'low', scale: 'log' },
    gpqa: { label: 'GPQA Diamond', long: 'GPQA Diamond', fmt: pct, better: 'high' },
    hle: { label: "Humanity's Last Exam", long: "Humanity's Last Exam", fmt: pct, better: 'high' },
    scicode: { label: 'SciCode', long: 'SciCode', fmt: pct, better: 'high' },
    terminalBench: { label: 'Terminal-Bench', long: 'Terminal-Bench', fmt: pct, better: 'high' },
    omniscience: { label: 'Omniscience Index', long: 'AA-Omniscience Index', fmt: (v) => v.toFixed(1), better: 'high' },
    gdpval: { label: 'GDPval-AA (Elo)', long: 'GDPval-AA Elo', fmt: (v) => Math.round(v), better: 'high' },
  };
  const Y_METRICS = ['intelligence', 'gpqa', 'hle', 'scicode', 'terminalBench', 'omniscience', 'gdpval'];
  const X_METRICS = ['costPerTask', 'costToRun', 'priceBlended', 'priceOutput', 'outputTokens', 'outputSpeed', 'ttft', 'e2e', 'timePerTask', 'intelligence'];

  // ---------- sync ----------

  const SYNC_GIST = 'a339af8bc76faf44020b123eed68f4f1', SYNC_FILE = 'aa-charts-sync.json';

  // ---------- scales ----------
  function niceStep(span, count) {

  function renderSetSelect() {

    const opt = (n) => `<option value="${esc(n)}" ${n === S.activeSet ? 'selected' : ''}>${esc(n)}${n === S.activeSet && dirty ? ' (edited)' : ''}</option>`;
    $('setSelect').innerHTML = `<option value="">— Load a set —</option>` +
      (names.length ? `<optgroup label="My sets">${names.map(opt).join('')}</optgroup>` : '') +
      `<optgroup label="Presets">${Object.keys(BUILTIN_SETS).map(opt).join('')}</optgroup>`;
    $('setUpdate').disabled = $('setDelete').disabled = !sets[S.activeSet];
  }
  const persistSets = () => { store(SETS_KEY, JSON.stringify(sets)); schedulePush(); };
  $('setSelect').addEventListener('change', (e) => {
    const n = e.target.value; S.activeSet = n; dirty = false;
    if (sets[n]) applySet(sets[n]); else if (BUILTIN_SETS[n]) applySet(BUILTIN_SETS[n]());
    renderSetSelect(); save();
  });
  $('setSave').addEventListener('click', () => {
    const n = prompt('Name this set (models, efforts, axes & display options):', sets[S.activeSet] ? S.activeSet : '');
    if (!n) return;
    if (sets[n] && !confirm(`Overwrite "${n}"?`)) return;
    sets[n] = snapshot(); S.activeSet = n; dirty = false; persistSets(); save(); renderSetSelect();
  });
  $('setUpdate').addEventListener('click', () => { if (!sets[S.activeSet]) return; sets[S.activeSet] = snapshot(); dirty = false; persistSets(); renderSetSelect(); });
  $('setDelete').addEventListener('click', () => {

  });
  $('setExport').addEventListener('click', () => download('aa-model-sets.json', new Blob([JSON.stringify(sets, null, 2)], { type: 'application/json' })));
  $('setImport').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (e) => {
    const f = e.target.files[0]; if (!f) return;
    try { const obj = JSON.parse(await f.text()); Object.assign(sets, obj); persistSets(); renderSetSelect(); alert(`Imported ${Object.keys(obj).length} set(s).`); }
    catch (err) { alert('Could not read that file: ' + err.message); }
    e.target.value = '';
  });

  // ---------- controls ----------
  $('ySel').innerHTML = Y_METRICS.map((k) => `<option value="${k}">${METRICS[k].label}</option>`).join('');
  $('xSel').innerHTML = X_METRICS.map((k) => `<option value="${k}">${METRICS[k].label}</option>`).join('');
  const syncs = [
    bindSeg('xScale', 'xScale'), bindSeg('yScale', 'yScale'), bindSeg('paretoSeg', 'pareto'),
    bindSeg('guideSeg', 'guides'), bindSeg('labelSeg', 'labels'), bindSeg('colorSeg', 'colorBy'),
    bindSeg('themeSeg', 'theme', applyTheme), bindSeg('markStyleSeg', 'markStyle', markDirty),
    bindSeg('gridSeg', 'grid', markDirty), bindSeg('axisSeg', 'axisText', markDirty),
  ];
  function syncControls() {
    $('markSel').value = S.markEffort; $('xSel').value = S.x; $('ySel').value = S.y; $('connect').checked = S.connect; $('fullFrontier').checked = S.fullFrontier;
    $('showDeprecated').checked = S.showDeprecated; $('openOnly').checked = S.openOnly; $('addEffort').value = S.addEffort;
    syncs.forEach((f) => f());
  }
  $('xSel').addEventListener('change', (e) => { S.x = e.target.value; S.xScale = METRICS[S.x].scale || 'linear'; markDirty(); syncControls(); save(); renderList(); render(); });
  $('ySel').addEventListener('change', (e) => { S.y = e.target.value; S.yScale = METRICS[S.y].scale || 'linear'; markDirty(); syncControls(); save(); render(); });
  $('markSel').innerHTML = '<option value="none">No mark</option>' + EFFORTS.filter((e) => e !== 'non-reasoning').map((e) => `<option value="${e}">${EFFORT_LABEL[e]}</option>`).join('');
  $('markSel').addEventListener('change', (e) => { S.markEffort = e.target.value; markDirty(); save(); render(); });
  $('connect').addEventListener('change', (e) => { S.connect = e.target.checked; save(); render(); });
  $('fullFrontier').addEventListener('change', (e) => { S.fullFrontier = e.target.checked; if (S.fullFrontier && S.pareto === 'off') { S.pareto = 'step'; syncControls(); } markDirty(); save(); render(); });
  $('showDeprecated').addEventListener('change', (e) => { S.showDeprecated = e.target.checked; save(); renderList(); });
  $('openOnly').addEventListener('change', (e) => { S.openOnly = e.target.checked; save(); renderList(); });
  $('addEffort').addEventListener('change', (e) => { S.addEffort = e.target.value; save(); });
  $('search').addEventListener('input', (e) => { search = e.target.value; renderList(); });
  $('selDefaults').addEventListener('click', () => { S.selected = new Set(defaultSelection()); markDirty(); save(); renderList(); render(); });
  $('selTop').addEventListener('click', () => { S.selected = new Set(visibleCatalog({ keepSelected: false }).slice(0, 20).map((m) => m.id)); markDirty(); save(); renderList(); render(); });
  $('selNone').addEventListener('click', () => { S.selected.clear(); S.pinned.clear(); markDirty(); save(); renderList(); render(); });
  // phone layout: models sheet + collapsible options
  const setSheet = (open) => document.body.classList.toggle('sheet-open', open);
  $('openSheet').addEventListener('click', () => setSheet(true));
  $('closeSheet').addEventListener('click', () => setSheet(false));
  $('scrim').addEventListener('click', () => setSheet(false));
  $('toggleOpts').addEventListener('click', (e) => e.currentTarget.setAttribute('aria-pressed', String(document.body.classList.toggle('opts-open'))));
  function applyTheme() {
    if (S.theme === 'system') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', S.theme);
    renderList();
  }
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { renderList(); render(); });

  // ---------- chart ----------
  const svg = $('chart');
  let lastPoints = [], lastGhosts = [], lastGeom = null;

  function render() {
    const card = $('chartCard'), cs = getComputedStyle(card);
    const W = Math.max(280, Math.floor(card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)));
    // Narrow (phone): a taller-than-wide plot that fits the screen, tighter margins, horizontal y title.
    const narrow = W < 560;
    const H = narrow ? Math.round(Math.max(340, Math.min(W * 1.35, innerHeight * 0.66))) : Math.round(Math.min(760, Math.max(440, W * 0.6)));
    const M = narrow ? { top: 26, right: 12, bottom: 44, left: 46 } : { top: 16, right: 28, bottom: 58, left: 70 };
    const PW = W - M.left - M.right, PH = H - M.top - M.bottom;
    const X = METRICS[S.x], Y = METRICS[S.y];
    const C = { surface: css('--surface'), ink: css('--ink'), ink2: css('--ink-2'), muted: css('--muted'), grid: css('--grid'), axis: css('--axis') };

    $('chartTitle').textContent = `${Y.label} vs. ${X.label}`;
    const xDir = X.better === 'low' ? 'lower is better' : 'higher is better';
    $('chartSub').textContent = `${Y.long} (higher is better) against ${X.long.charAt(0).toLowerCase() + X.long.slice(1)} (${xDir}). ${S.xScale === 'log' ? 'Log' : 'Linear'} x · ${S.yScale === 'log' ? 'log' : 'linear'} y.`;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', W); svg.setAttribute('height', H);
    svg.setAttribute('aria-label', $('chartTitle').textContent);
    svg.replaceChildren();

    const chosen = [...S.selected].map((id) => BY_ID.get(id)).filter((m) => m && S.efforts.has(m.effort));
    const missing = [];
    let points = [];
    for (const m of chosen) {
      const xv = m[S.x], yv = m[S.y];
      const okX = xv != null && (S.xScale !== 'log' || xv > 0), okY = yv != null && (S.yScale !== 'log' || yv > 0);
      if (okX && okY) points.push({ m, xv, yv }); else missing.push(m);
    }
    const hiddenByEffort = S.selected.size - chosen.length;
    let note = [];
    if (missing.length) note.push(`${missing.length} selected model${missing.length > 1 ? 's have' : ' has'} no ${!missing.every((m) => m[S.x] != null) ? X.label.toLowerCase() : Y.label.toLowerCase()} data${S.xScale === 'log' || S.yScale === 'log' ? ' (or a non-positive value on a log axis)' : ''}: ${missing.slice(0, 6).map((m) => m.label).join(', ')}${missing.length > 6 ? '…' : ''}`);
    if (hiddenByEffort) note.push(`${hiddenByEffort} hidden by the effort filter.`);
    $('chartNote').textContent = note.join(' · ');
    $('chartFoot').innerHTML = `Each dot is one reasoning effort level, low to max${S.markEffort !== 'none' ? `; the ${S.markStyle} marks ${EFFORT_LABEL[S.markEffort]}` : ''}. A lone dot has one setting only. Dashed lines are older versions. ${matchMedia('(hover: none)').matches ? 'Tap a dot for its values; tap again to pin it.' : 'Hover a dot for its values; click to pin it.'}<br>Data: <a href="https://artificialanalysis.ai" style="color:inherit">Artificial Analysis</a>, ${esc(new Date(DATA.scrapedAt).toISOString().slice(0, 10))}`;

    // background
    svg.append(svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: C.surface }));
    if (!points.length) {
      svg.append(svgEl('text', { x: W / 2, y: H / 2, 'text-anchor': 'middle', fill: C.muted, 'font-size': 14 }, 'Select models in the sidebar to plot them.'));
      $('legend').innerHTML = ''; renderTable([], new Set()); lastPoints = []; lastGhosts = []; return;
    }

    // "all models" frontier: the true frontier among every model matching the sidebar filters.
    // Frontier models you haven't selected are drawn as faint dots; ones scoring below your selection are left off-scale.
    let front = [], ghosts = [], inScale = [];
    if (S.pareto !== 'off') {
      if (S.fullFrontier) {
        const shown = new Set(points.map((p) => p.m.id));
        const pool = points.concat(ALL.filter((m) => !shown.has(m.id) && (S.showDeprecated || !m.deprecated) && (!S.openOnly || m.openWeights) && S.efforts.has(m.effort))
          .map((m) => ({ m, xv: m[S.x], yv: m[S.y], ghost: true }))
          .filter((p) => p.xv != null && p.yv != null && (S.xScale !== 'log' || p.xv > 0) && (S.yScale !== 'log' || p.yv > 0)));
        front = paretoFront(pool);
        ghosts = front.filter((p) => p.ghost);
        const ys = points.map((p) => p.yv), yLow = Y.better === 'low';
        inScale = ghosts.filter((p) => yLow ? p.yv <= Math.max(...ys) : p.yv >= Math.min(...ys));
      } else front = paretoFront(points);
    }
    const sx = makeScale(points.concat(inScale).map((p) => p.xv), S.xScale, [M.left, M.left + PW]);
    const sy = makeScale(points.concat(inScale).map((p) => p.yv), S.yScale, [M.top + PH, M.top]);
    for (const p of points.concat(ghosts)) { p.px = sx.f(p.xv); p.py = sy.f(p.yv); p.color = colorOf(p.m); }
    const visibleGhosts = inScale;
    lastPoints = points; lastGhosts = visibleGhosts; lastGeom = { M, PW, PH, sx, sy, W, H };
    if (visibleGhosts.length) $('chartNote').textContent = [`${visibleGhosts.length} frontier model${visibleGhosts.length > 1 ? 's' : ''} you haven't selected ${visibleGhosts.length > 1 ? 'are' : 'is'} shown faint — click one to add it.`, $('chartNote').textContent].filter(Boolean).join(' · ');

    // grid + ticks (dropping any that would crowd their neighbours on a narrow chart)
    const thin = (ticks, f, gap) => { const out = []; let last = -Infinity; for (const t of ticks) { const v = f(t); if (Math.abs(v - last) >= gap) { out.push(t); last = v; } } return out; };
    sx.ticks = thin(sx.ticks, sx.f, Math.max(...sx.ticks.map((t) => textW(X.fmt(t), 11))) + 12);
    sy.ticks = thin(sy.ticks.slice().reverse(), sy.f, 20).reverse();
    const g = svgEl('g');
    const gridAttrs = { stroke: C.grid, 'stroke-width': 1, 'stroke-opacity': S.grid === 'faint' ? 0.4 : 1 };
    const axisText = S.axisText === 'faint' ? { opacity: 0.45 } : {};
    for (const t of sy.ticks) {
      const y = sy.f(t);
      if (S.grid !== 'off') g.append(svgEl('line', { ...gridAttrs, x1: M.left, x2: M.left + PW, y1: y, y2: y }));
      g.append(svgEl('text', { ...axisText, x: M.left - 8, y: y + 4, 'text-anchor': 'end', fill: C.muted, 'font-size': 11, style: 'font-variant-numeric:tabular-nums' }, Y.fmt(t)));
    }
    for (const t of sx.ticks) {
      const x = sx.f(t);
      if (S.grid !== 'off') g.append(svgEl('line', { ...gridAttrs, x1: x, x2: x, y1: M.top, y2: M.top + PH }));
      g.append(svgEl('text', { ...axisText, x, y: M.top + PH + 18, 'text-anchor': 'middle', fill: C.muted, 'font-size': 11, style: 'font-variant-numeric:tabular-nums' }, X.fmt(t)));
    }
    g.append(svgEl('line', { x1: M.left, x2: M.left + PW, y1: M.top + PH, y2: M.top + PH, stroke: C.axis }));
    g.append(svgEl('line', { x1: M.left, x2: M.left, y1: M.top, y2: M.top + PH, stroke: C.axis }));
    g.append(svgEl('text', { ...axisText, x: M.left + PW / 2, y: H - (narrow ? 8 : 12), 'text-anchor': 'middle', fill: C.ink2, 'font-size': narrow ? 11 : 12, 'font-weight': 500 }, `${narrow ? X.label : X.long}${S.xScale === 'log' ? (narrow ? ' (log)' : ' · log scale') : ''}  ${X.better === 'low' ? '← better' : 'better →'}`));
    if (narrow) g.append(svgEl('text', { ...axisText, x: 4, y: 12, fill: C.ink2, 'font-size': 11, 'font-weight': 500 }, `${Y.label}${S.yScale === 'log' ? ' (log)' : ''}  ↑ better`));
    else g.append(svgEl('text', { ...axisText, x: 0, y: 0, 'text-anchor': 'middle', fill: C.ink2, 'font-size': 12, 'font-weight': 500, transform: `translate(18 ${M.top + PH / 2}) rotate(-90)` }, `${Y.long}${S.yScale === 'log' ? ' · log scale' : ''}  better →`));
    // "most attractive quadrant" hint
    const qx = X.better === 'low' ? M.left + 10 : M.left + PW - 10;
    if (!narrow) g.append(svgEl('text', { ...axisText, x: qx, y: M.top + 14, 'text-anchor': X.better === 'low' ? 'start' : 'end', fill: C.muted, 'font-size': 11 }, 'Most attractive quadrant'));
    svg.append(g);

    const plot = svgEl('g'); svg.append(plot);
    const clipId = 'plotclip';
    const defs = svgEl('defs'); const cp = svgEl('clipPath', { id: clipId }); cp.append(svgEl('rect', { x: M.left, y: M.top, width: PW, height: PH })); defs.append(cp); svg.prepend(defs);

    // pareto
    const segs = []; // line segments labels should avoid
    const frontSet = new Set(front.map((p) => p.m.id));
    const guideLayer = svgEl('g', { 'clip-path': `url(#${clipId})` }); plot.append(guideLayer);
    const lineLayer = svgEl('g', { 'clip-path': `url(#${clipId})` }); plot.append(lineLayer);
    if (front.length) {
      let d = `M${front[0].px},${front[0].py}`;
      for (let i = 1; i < front.length; i++) {
        const a = front[i - 1], b = front[i];
        d += S.pareto === 'step' ? ` L${b.px},${a.py} L${b.px},${b.py}` : ` L${b.px},${b.py}`;
      }
      const nums = d.match(/-?[\d.]+/g).map(Number);
      for (let i = 2; i + 1 < nums.length; i += 2) segs.push([nums[i - 2], nums[i - 1], nums[i], nums[i + 1]]);
      lineLayer.append(svgEl('path', { d, fill: 'none', stroke: C.ink, 'stroke-width': 1.25, 'stroke-opacity': 0.35, 'stroke-linejoin': 'round' }));
    }

    // one line per model: its reasoning effort levels, low -> max (non-reasoning stays a lone dot)
    const series = new Map();
    for (const p of points) {
      const k = p.m.family + (p.m.effort === 'non-reasoning' ? ':nr' : '');
      (series.get(k) || series.set(k, []).get(k)).push(p);
    }
    for (const ps of series.values()) {
      ps.sort((a, b) => a.m.effortLevel - b.m.effortLevel || a.xv - b.xv);
      ps.forEach((p, i) => { p.series = ps; p.isEnd = i === ps.length - 1; });
      if (!S.connect || ps.length < 2) continue;
      for (let i = 1; i < ps.length; i++) segs.push([ps[i - 1].px, ps[i - 1].py, ps[i].px, ps[i].py]);
      const older = FAMILY.get(ps[0].m.family)?.older;
      lineLayer.append(svgEl('polyline', { 'data-fam': ps[0].m.family, points: ps.map((p) => `${p.px},${p.py}`).join(' '), fill: 'none', stroke: S.colorBy === 'lab' ? ps[0].color : C.muted, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', 'stroke-dasharray': older ? '6 5' : null, 'stroke-opacity': S.colorBy === 'lab' ? 0.95 : 0.5 }));
    }

    // guides ("intersecting squares")
    const guideIds = new Set(
      S.guides === 'all' ? points.map((p) => p.m.id) :
      S.guides === 'frontier' ? [...frontSet, ...S.pinned] :
      S.guides === 'pinned' || S.guides === 'hover' ? [...S.pinned] : []);
    const chipLayer = svgEl('g');
    const guidePts = points.filter((p) => guideIds.has(p.m.id));
    for (const p of guidePts) drawGuide(p, guideLayer, guidePts.length <= 12 ? chipLayer : null, S.pinned.has(p.m.id) ? 0.9 : 0.5);

    // points: frontier + pinned drawn last (on top)
    const dotLayer = svgEl('g'); plot.append(dotLayer);
    // mark the chosen effort level on every model's line
    for (const p of points) {
      if (p.m.effort !== S.markEffort) continue;
      const fam = { 'data-fam': p.m.family, stroke: p.color };
      if (S.markStyle === 'ring') {
        dotLayer.append(svgEl('circle', { ...fam, cx: p.px, cy: p.py, r: 9, fill: 'none', 'stroke-width': 2 }));
      } else if (S.markStyle === 'square') {
        dotLayer.append(svgEl('rect', { ...fam, x: p.px - 8, y: p.py - 8, width: 16, height: 16, rx: 2, fill: 'none', 'stroke-width': 2 }));
      } else {
        // hash: a tick across the line, perpendicular to it at this dot
        const ps = p.series || [p], i = ps.indexOf(p);
        const a = ps[Math.max(0, i - 1)], b = ps[Math.min(ps.length - 1, i + 1)];
        let dx = b.px - a.px, dy = b.py - a.py, len = Math.hypot(dx, dy);
        if (!len) { dx = 1; dy = 0; len = 1; } // lone dot: vertical tick
        const nx = -dy / len * 12, ny = dx / len * 12;
        dotLayer.append(svgEl('line', { ...fam, x1: p.px - nx, y1: p.py - ny, x2: p.px + nx, y2: p.py + ny, 'stroke-width': 3, 'stroke-linecap': 'round' }));
      }
    }
    const ghostLayer = svgEl('g', { 'clip-path': `url(#${clipId})` }); dotLayer.append(ghostLayer);
    for (const p of ghosts) ghostLayer.append(svgEl('circle', { cx: p.px, cy: p.py, r: 4.5, fill: p.color, 'fill-opacity': 0.4, stroke: p.color, 'stroke-opacity': 0.7, 'stroke-width': 1.25 }));
    const order = points.slice().sort((a, b) => (frontSet.has(a.m.id) + S.pinned.has(a.m.id) * 2) - (frontSet.has(b.m.id) + S.pinned.has(b.m.id) * 2));
    for (const p of order) {
      const r = S.pinned.has(p.m.id) ? 6.5 : p.isEnd ? 5.5 : 4.25;
      if (frontSet.has(p.m.id)) dotLayer.append(svgEl('circle', { 'data-fam': p.m.family, cx: p.px, cy: p.py, r: r + 3.5, fill: 'none', stroke: C.ink, 'stroke-width': 1, 'stroke-opacity': 0.45 }));
      dotLayer.append(svgEl('circle', { 'data-fam': p.m.family, cx: p.px, cy: p.py, r, fill: p.color, stroke: C.surface, 'stroke-width': 2, 'fill-opacity': p.m.estimated ? 0.45 : 1 }));
    }
    plot.append(chipLayer);

    // labels
    const labelLayer = svgEl('g'); plot.append(labelLayer);
    if (S.labels !== 'none') placeLabels(points, frontSet, labelLayer, { M, PW, PH, C, segs, ghosts: visibleGhosts });

    // hover layer
    const hoverLayer = svgEl('g', { id: 'hoverLayer', 'pointer-events': 'none' }); svg.append(hoverLayer);
    svg.append(svgEl('rect', { id: 'hit', x: M.left, y: M.top, width: PW, height: PH, fill: 'transparent', style: 'cursor:crosshair' }));

    renderLegend(points, visibleGhosts.length > 0);
    renderTable(points, frontSet);
  }

  // The "intersecting square": dashed lines from the dot to both axes, meeting at the dot,
  // with the exact values written onto the axes in the model's color.
  function drawGuide(p, layer, chips, strength = 1) {
    const { M, PW, PH } = lastGeom, X = METRICS[S.x], Y = METRICS[S.y];
    const surface = css('--surface'), x0 = M.left, y0 = M.top + PH;
    layer.append(svgEl('rect', { x: Math.min(x0, p.px), y: Math.min(p.py, y0), width: Math.abs(p.px - x0), height: Math.abs(y0 - p.py), fill: p.color, 'fill-opacity': 0.05 * strength }));
    const line = { stroke: p.color, 'stroke-width': 1.25, 'stroke-dasharray': '4 4', 'stroke-opacity': strength };
    layer.append(svgEl('line', { ...line, x1: p.px, x2: p.px, y1: p.py, y2: y0 }));
    layer.append(svgEl('line', { ...line, x1: x0, x2: p.px, y1: p.py, y2: p.py }));
    if (!chips) return;
    const xt = X.fmt(p.xv), yt = Y.fmt(p.yv), font = { 'font-size': 12, 'font-weight': 700, fill: p.color, style: 'font-variant-numeric:tabular-nums' };
    const xw = textW(xt, 12, 700) + 12, yw = textW(yt, 12, 700) + 10;
    const cx = Math.max(M.left + xw / 2, Math.min(M.left + PW - xw / 2, p.px));
    // surface-colored backing hides the tick label underneath
    chips.append(svgEl('rect', { x: cx - xw / 2, y: y0 + 5, width: xw, height: 18, fill: surface }));
    chips.append(svgEl('text', { ...font, x: cx, y: y0 + 18, 'text-anchor': 'middle' }, xt));
    chips.append(svgEl('rect', { x: M.left - yw - 6, y: p.py - 9, width: yw + 4, height: 18, fill: surface }));
    chips.append(svgEl('text', { ...font, x: M.left - 8, y: p.py + 4, 'text-anchor': 'end' }, yt));
  }

  function placeLabels(points, frontSet, layer, { M, PW, PH, C, segs, ghosts = [] }) {
    const H = 14, pad = 3;
    const boxes = points.concat(ghosts).map((p) => ({ x0: p.px - 6, y0: p.py - 6, x1: p.px + 6, y1: p.py + 6 }));
    const segHit = (b) => segs.some(([x1, y1, x2, y2]) => {
      const n = Math.max(2, Math.ceil(Math.hypot(x2 - x1, y2 - y1) / 4));
      for (let i = 0; i <= n; i++) { const x = x1 + (x2 - x1) * i / n, y = y1 + (y2 - y1) * i / n; if (x > b.x0 && x < b.x1 && y > b.y0 && y < b.y1) return true; }
      return false;
    });
    const hit = (b) => boxes.some((o) => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0) || segHit(b);
    const prio = (p) => (S.pinned.has(p.m.id) ? 1000 : 0) + (frontSet.has(p.m.id) ? 500 : 0) + p.m.intelligence;
    // "Models" mode: one label per line, at its highest-effort end, named after the model. Pinned dots get their own.
    // "Auto" mode: model names as in "Models", then a short effort tag on every other dot that has room.
    // "Auto+" also puts the top dot's effort after its model name, in the same muted style as the other tags.
    const autoMode = S.labels === 'auto' || S.labels === 'autoplus', seriesMode = S.labels === 'series' || autoMode;
    const tagOnly = (p) => autoMode && !p.isEnd && !S.pinned.has(p.m.id);
    const ordered = points.filter((p) => autoMode || !seriesMode || p.isEnd || S.pinned.has(p.m.id))
      .sort((a, b) => (tagOnly(a) - tagOnly(b)) || prio(b) - prio(a));
    let ghostsPlaced = false;
    for (const p of ordered) {
      if (tagOnly(p) && !ghostsPlaced) { placeGhosts(); ghostsPlaced = true; } // faint frontier names outrank effort tags
      const asSeries = seriesMode && p.isEnd && !S.pinned.has(p.m.id);
      const tag = tagOnly(p);
      const t = tag ? (p.m.effort === 'default' ? '' : EFFORT_LABEL[p.m.effort].toLowerCase()) : asSeries ? (p.m.effort === 'non-reasoning' && p.series.length === 1 && points.some((o) => o.m.family === p.m.family && o !== p) ? p.m.label : p.m.familyName) : p.m.label;
      if (!t) continue;
      const size = asSeries ? 12.5 : tag ? 10 : 11, weight = asSeries || S.pinned.has(p.m.id) ? 600 : 400;
      const suffix = asSeries && S.labels === 'autoplus' && p.m.effort !== 'default' && p.m.effort !== 'non-reasoning' ? EFFORT_LABEL[p.m.effort].toLowerCase() : '';
      const SUF = { size: 10.5, gap: 5 };
      const w = textW(t, size, weight) + (suffix ? SUF.gap + textW(suffix, SUF.size, 500) : 0);
      const cands = [
        ...(asSeries ? [[-w / 2, -11 - H], [10, -H / 2], [8, -H - 6]] : []),
        [9, -H / 2], [-9 - w, -H / 2], [-w / 2, -9 - H], [-w / 2, 9], [8, -H - 4], [8, 4], [-8 - w, -H - 4], [-8 - w, 4],
        [14, -H / 2 - 12], [14, -H / 2 + 12], [-14 - w, -H / 2 - 12], [-14 - w, -H / 2 + 12],
        // labels that must appear (model names, pinned) may sit further out before overlapping anything
        ...(asSeries || S.pinned.has(p.m.id) || S.labels === 'all' ? [[-w / 2, -24 - H], [-w / 2, 22], [18, -H / 2 - 20], [18, -H / 2 + 20], [-18 - w, -H / 2 - 20], [-18 - w, -H / 2 + 20], [-w / 2, -38 - H], [-w / 2, 36], [24, -H / 2 - 32], [-24 - w, -H / 2 + 32]] : []),
      ];
      let placed = null;
      for (const [dx, dy] of cands) {
        const b = { x0: p.px + dx - pad, y0: p.py + dy - 1, x1: p.px + dx + w + pad, y1: p.py + dy + H };
        if (b.x0 < M.left || b.x1 > M.left + PW + M.right - 4 || b.y0 < M.top || b.y1 > M.top + PH) continue;
        if (!hit(b)) { placed = { dx, dy, b }; break; }
      }
      if (!placed && (S.labels === 'all' || asSeries || S.pinned.has(p.m.id))) { const dx = asSeries ? -w / 2 : 9, dy = asSeries ? -11 - H : -H / 2; placed = { dx, dy, b: { x0: p.px + dx - pad, y0: p.py + dy - 1, x1: p.px + dx + w + pad, y1: p.py + dy + H } }; }
      if (!placed) continue;
      if (placed.b) boxes.push(placed.b);
      const tx = p.px + placed.dx, ty = p.py + placed.dy + 11;
      const attrs = { 'data-fam': p.m.family, x: tx, y: ty, fill: tag ? C.muted : asSeries && S.colorBy === 'lab' ? p.color : S.pinned.has(p.m.id) ? C.ink : C.ink2, 'font-size': size, 'font-weight': weight, stroke: C.surface, 'stroke-width': 3.5, 'paint-order': 'stroke', 'stroke-linejoin': 'round' };
      const el = svgEl('text', attrs, suffix ? null : t);
      if (suffix) el.append(svgEl('tspan', {}, t), svgEl('tspan', { dx: SUF.gap, fill: C.muted, 'font-size': SUF.size, 'font-weight': 500 }, suffix));
      layer.append(el);
    }
    if (!ghostsPlaced) placeGhosts();
    // faint frontier models you haven't selected: a small muted name, only where it fits
    function placeGhosts() { for (const p of ghosts.slice().sort((a, b) => b.m.intelligence - a.m.intelligence)) {
      const t = p.m.label, w = textW(t, 10);
      for (const [dx, dy] of [[10, -H / 2], [-10 - w, -H / 2], [-w / 2, -10 - H], [-w / 2, 10], [10, -H - 2], [10, 2], [-10 - w, -H - 2], [-10 - w, 2], [4, -H - 12], [4, 12], [-4 - w, -H - 12], [-4 - w, 12], [2, 22], [2, -H - 22]]) {
        const b = { x0: p.px + dx - pad, y0: p.py + dy - 1, x1: p.px + dx + w + pad, y1: p.py + dy + H };
        if (b.x0 < M.left || b.x1 > M.left + PW + M.right - 4 || b.y0 < M.top || b.y1 > M.top + PH || hit(b)) continue;
        boxes.push(b);
        layer.append(svgEl('text', { x: p.px + dx, y: p.py + dy + 11, fill: C.muted, 'fill-opacity': 0.8, 'font-size': 10, stroke: C.surface, 'stroke-width': 3, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, t));
        break;
      }
    } }
  }

  function renderLegend(points, ghosts) {
    let items = [];
    if (S.colorBy === 'lab') {
      const seen = new Map();
      for (const p of points) {
        const key = LAB_SLOT[p.m.creatorSlug] ? p.m.creatorSlug : '__other';
        if (!seen.has(key)) seen.set(key, { name: key === '__other' ? 'Other labs' : p.m.creator, color: p.color, slot: LAB_SLOT[p.m.creatorSlug] || 99 });
      }
      items = [...seen.values()].sort((a, b) => a.slot - b.slot);
    } else if (S.colorBy === 'effort') {
      const present = new Set(points.map((p) => p.m.effort));
      items = EFFORTS.filter((e) => present.has(e)).map((e) => ({ name: EFFORT_LABEL[e], color: css(EFFORT_VAR[e]) }));
    } else {
      items = [{ name: 'Open weights', color: css('--s3') }, { name: 'Proprietary', color: css('--s7') }];
    }
    const extras = [];
    if (points.some((p) => p.m.effort === S.markEffort)) {
      const k = css('--ink-2');
      const mark = S.markStyle === 'ring' ? `<circle cx="11" cy="7" r="6" fill="none" stroke="${k}" stroke-width="1.5"/>`
        : S.markStyle === 'square' ? `<rect x="5" y="1" width="12" height="12" rx="2" fill="none" stroke="${k}" stroke-width="1.5"/>`
        : `<line x1="11" x2="11" y1="0" y2="14" stroke="${k}" stroke-width="2.5" stroke-linecap="round"/>`;
      extras.push(`<span><svg width="22" height="14"><line x1="1" x2="21" y1="7" y2="7" stroke="${k}" stroke-width="2"/>${mark}<circle cx="11" cy="7" r="3.5" fill="${k}"/></svg>${EFFORT_LABEL[S.markEffort]} effort</span>`);
    }
    if (points.some((p) => FAMILY.get(p.m.family)?.older)) extras.push(`<span><svg width="22" height="10"><line x1="1" x2="21" y1="5" y2="5" stroke="${css('--ink-2')}" stroke-width="2" stroke-dasharray="4 3"/></svg>Older version</span>`);
    if (S.pareto !== 'off') extras.push(`<span><svg width="22" height="10"><path d="M1 9 L1 5 L11 5 L11 1 L21 1" fill="none" stroke="${css('--ink')}" stroke-opacity=".55" stroke-width="1.5"/></svg>Pareto frontier (ringed points)</span>`);
    if (ghosts) extras.push(`<span><svg width="10" height="10"><circle cx="5" cy="5" r="4" fill="${css('--ink-2')}" fill-opacity=".3" stroke="${css('--ink-2')}" stroke-opacity=".55"/></svg>Frontier model not selected</span>`);
    if (points.some((p) => p.m.estimated)) extras.push(`<span><i style="background:${css('--muted')};opacity:.45"></i>Estimated score</span>`);
    $('legend').innerHTML = items.map((i) => `<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('') + extras.join('');
  }

  // ---------- table ----------
  let tableSort = { key: 'yv', dir: -1 };
  function renderTable(points, frontSet) {
    const X = METRICS[S.x], Y = METRICS[S.y];
    const rows = points.slice().sort((a, b) => {
      const k = tableSort.key;
      const va = k === 'name' ? a.m.label : k === 'lab' ? a.m.creator : k === 'effort' ? a.m.effortLevel : a[k];
      const vb = k === 'name' ? b.m.label : k === 'lab' ? b.m.creator : k === 'effort' ? b.m.effortLevel : b[k];
      return (va > vb ? 1 : va < vb ? -1 : 0) * tableSort.dir;
    });
    const th = (k, t) => `<th data-k="${k}">${t}${tableSort.key === k ? (tableSort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>`;
    $('dataTable').innerHTML = `<thead><tr>${th('name', 'Model')}${th('lab', 'Lab')}${th('effort', 'Effort')}${th('yv', esc(Y.label))}${th('xv', esc(X.label))}<th>Frontier</th></tr></thead><tbody>` +
      rows.map((p) => `<tr><td><i style="background:${p.color}"></i>${esc(p.m.label)}</td><td>${esc(p.m.creator)}</td><td>${EFFORT_LABEL[p.m.effort]}</td><td class="n">${Y.fmt(p.yv)}</td><td class="n">${X.fmt(p.xv)}</td><td>${frontSet.has(p.m.id) ? '✓' : ''}</td></tr>`).join('') + '</tbody>';
  }
  $('dataTable').addEventListener('click', (e) => {
    const k = e.target.closest('th')?.dataset.k; if (!k) return;
    tableSort = { key: k, dir: tableSort.key === k ? -tableSort.dir : (k === 'name' || k === 'lab' ? 1 : -1) };
    render();
  });

  // ---------- hover / pin ----------
  const tip = $('tooltip');
  function nearest(evt) {
    if (!lastPoints.length) return null;
    const pt = svg.createSVGPoint(); pt.x = evt.clientX; pt.y = evt.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    let best = null, bd = 28 * 28;
    for (const p of lastPoints.concat(lastGhosts)) { const d = (p.px - loc.x) ** 2 + (p.py - loc.y) ** 2; if (d < bd) { bd = d; best = p; } }
    return best;
  }
  // Mouse: hover inspects, click pins. Touch: first tap inspects (details dock at the bottom), second tap pins.
  let touch = false, inspected = null;
  function clearHover() { inspected = null; tip.style.display = 'none'; $('hoverLayer')?.replaceChildren(); svg.querySelectorAll('[data-fam]').forEach((el) => el.removeAttribute('opacity')); }
  function inspect(evt) {
    const layer = $('hoverLayer'); if (!layer) return;
    const p = nearest(evt);
    layer.replaceChildren();
    if (!p) { clearHover(); return; }
    inspected = p.m.id;
    const C = { surface: css('--surface'), ink: css('--ink') };
    drawGuide(p, layer, layer, 1);
    layer.append(svgEl('circle', { cx: p.px, cy: p.py, r: 7, fill: p.color, stroke: C.surface, 'stroke-width': 2 }));
    // name + effort right at the dot
    const name = p.m.familyName, eff = p.m.effort === 'default' ? '' : `${EFFORT_LABEL[p.m.effort].toLowerCase()} effort`;
    const w = Math.max(textW(name, 13, 700), textW(eff, 11));
    const right = p.px + 12 + w < lastGeom.M.left + lastGeom.PW;
    const lx = right ? p.px + 12 : p.px - 12, anchor = right ? 'start' : 'end', halo = { stroke: C.surface, 'stroke-width': 4, 'paint-order': 'stroke', 'stroke-linejoin': 'round' };
    layer.append(svgEl('text', { ...halo, x: lx, y: p.py - (eff ? 10 : 4), 'text-anchor': anchor, fill: p.color, 'font-size': 13, 'font-weight': 700 }, name));
    if (eff) layer.append(svgEl('text', { ...halo, x: lx, y: p.py + 5, 'text-anchor': anchor, fill: p.color, 'font-size': 11 }, eff));
    // spotlight the hovered model's line
    svg.querySelectorAll('[data-fam]').forEach((el) => el.setAttribute('opacity', el.dataset.fam === p.m.family ? 1 : 0.28));

    const m = p.m;
    const rows = [S.y, S.x, ...['intelligence', 'costPerTask', 'costToRun', 'priceBlended', 'outputSpeed', 'outputTokens', 'e2e'].filter((k) => k !== S.x && k !== S.y)]
      .filter((k) => m[k] != null)
      .map((k) => `<tr class="${k === S.x || k === S.y ? 'hl' : ''}"><td>${METRICS[k].label}</td><td>${METRICS[k].fmt(m[k])}</td></tr>`).join('');
    tip.innerHTML = `<div class="t-name"><i style="background:${p.color}"></i>${esc(m.label)}</div>
      <div class="t-sub">${esc(m.creator)} · ${EFFORT_LABEL[m.effort]} effort · ${m.openWeights ? 'open weights' : 'proprietary'}${m.releaseDate ? ' · ' + m.releaseDate : ''}${m.estimated ? ' · estimated' : ''}</div>
      <table>${rows}</table><div class="t-foot">${p.ghost ? `On the frontier but not selected · ${touch ? 'tap again' : 'click'} to add it` : `${touch ? 'Tap again' : 'Click'} to ${S.pinned.has(m.id) ? 'unpin' : 'pin'}`}</div>`;
    tip.classList.toggle('docked', touch);
    tip.style.display = 'block';
    const r = tip.getBoundingClientRect();
    let left = evt.clientX + 16, top = evt.clientY + 16;
    if (left + r.width > innerWidth - 8) left = evt.clientX - r.width - 16;
    if (top + r.height > innerHeight - 8) top = evt.clientY - r.height - 16;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }
  document.addEventListener('pointerdown', (evt) => { if (inspected && evt.pointerType !== 'mouse' && !svg.contains(evt.target)) clearHover(); });
  svg.addEventListener('pointerdown', (evt) => { touch = evt.pointerType !== 'mouse'; });
  svg.addEventListener('pointermove', (evt) => { if (evt.pointerType === 'mouse') { touch = false; inspect(evt); } });
  svg.addEventListener('pointerleave', (evt) => { if (evt.pointerType === 'mouse') clearHover(); });
  svg.addEventListener('click', (evt) => {
    const p = nearest(evt);
    if (touch && (!p || p.m.id !== inspected)) { inspect(evt); return; }
    if (!p) return;
    inspected = null; tip.style.display = 'none';
    if (p.ghost) { S.selected.add(p.m.id); markDirty(); save(); renderList(); render(); return; }
    S.pinned.has(p.m.id) ? S.pinned.delete(p.m.id) : S.pinned.add(p.m.id);
    save(); render();
  });

  // ---------- export ----------
  function download(name, blob) {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  function svgString() {
    const clone = svg.cloneNode(true);
    clone.querySelector('#hoverLayer')?.remove(); clone.querySelector('#hit')?.remove();
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('font-family', 'system-ui, -apple-system, Segoe UI, sans-serif');
    return new XMLSerializer().serializeToString(clone);
  }
  const fileBase = () => `aa-${S.y}-vs-${S.x}`;
  $('downloadSvg').addEventListener('click', () => download(fileBase() + '.svg', new Blob([svgString()], { type: 'image/svg+xml' })));
  $('downloadPng').addEventListener('click', () => {
    const img = new Image(); const scale = 2;
    img.onload = () => {
      const c = document.createElement('canvas'); c.width = svg.width.baseVal.value * scale; c.height = svg.height.baseVal.value * scale;
      const ctx = c.getContext('2d'); ctx.scale(scale, scale); ctx.drawImage(img, 0, 0);
      c.toBlob((b) => download(fileBase() + '.png', b));
    };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString());
  });

  // ---------- data updates ----------
  const STALE_MS = 12 * 3600e3;
  let updating = false;
  function ago(iso) {
    const mins = Math.round((Date.now() - new Date(iso)) / 60000);
    return mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 48 * 60 ? `${Math.round(mins / 60)} h ago` : `${Math.round(mins / 1440)} days ago`;
  }
  function showMeta(extra = '', error = false) {
    const el = $('dataMeta');
    el.classList.toggle('error', error);
    el.textContent = !ALL.length ? extra :
      `${ALL.filter((m) => !m.deprecated).length} current models · data from ${ago(DATA.scrapedAt)} (${new Date(DATA.scrapedAt).toLocaleString()})` + (extra ? ' · ' + extra : '');
  }
  async function updateData() {
    if (updating) return;
    if (!window.AAData) { showMeta('Update needs aa-data.js next to this page — open "AI Model Frontier.html" instead.', true); return; }
    updating = true;
    const btn = $('updateData'), label = btn.innerHTML; btn.disabled = true; btn.textContent = 'Updating…';
    showMeta('fetching the latest numbers…');
    try {
      const d = await window.AAData.scrape();
      store(DATA_KEY, JSON.stringify(d)); // if storage is full, still use it for this session
      const before = new Set(ALL.map((m) => m.id));
      loadData(d);
      const added = ALL.filter((m) => !before.has(m.id) && !m.deprecated).length;
      S.selected = new Set([...S.selected].filter((id) => BY_ID.has(id)));
      S.pinned = new Set([...S.pinned].filter((id) => BY_ID.has(id)));
      if (!S.selected.size) S.selected = new Set(theoSelection());
      save(); renderList(); render();
      showMeta(before.size && added ? `updated · ${added} new model${added > 1 ? 's' : ''}` : 'updated');
    } catch (err) {
      showMeta(`update failed (${err.message}) — still showing the previous data`, true);
    } finally {
      updating = false; btn.disabled = false; btn.innerHTML = label;
    }
  }
  $('updateData').addEventListener('click', updateData);
  $('syncBtn').addEventListener('click', syncButton);
  // pick up changes made on another device when you come back to this tab
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); });
  // Keep itself current: update when opened if the data is stale, and re-check hourly while left open.
  const autoUpdate = () => { if (Date.now() - new Date(DATA.scrapedAt) > STALE_MS) updateData(); else showMeta(); };
  setInterval(autoUpdate, 3600e3);

  // ---------- boot ----------
  showMeta();
  // URL overrides, e.g. ?theme=dark&x=costPerTask&xScale=log&pin=claude-opus-5-5:low
  const qp = new URLSearchParams(location.search);
  for (const k of ['theme', 'x', 'y', 'xScale', 'yScale', 'pareto', 'guides', 'labels', 'colorBy', 'markEffort', 'markStyle', 'grid', 'axisText']) if (qp.get(k)) S[k] = qp.get(k);
  if (qp.get('fullFrontier')) S.fullFrontier = qp.get('fullFrontier') === '1';
  if (qp.get('pin')) S.pinned = new Set(qp.get('pin').split(',').map((t) => { const [fam, eff] = t.split(':'); return ALL.find((m) => m.family === fam && m.effort === eff)?.id; }).filter(Boolean));
  syncControls(); applyTheme(); renderSetSelect(); renderList(); render();
  autoUpdate();
  pull();
  let lastW = 0;
  new ResizeObserver(() => { const w = $('chartCard').clientWidth; if (w !== lastW) { lastW = w; render(); } }).observe($('chartCard'));
})();
</script>
</body>
</html>

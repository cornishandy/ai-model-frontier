# Builds and deploys the site to GitHub Pages on every push to main and every 30 minutes,
# refreshing the data first. The fresh data goes into the deployed site only (no commits).
# GitHub's schedule is best effort: scheduled runs often start hours late, and some may be dropped under load.
# If the scrape fails on a scheduled or manual run, the job fails and the previous deployment stays up (deploying the copy
# committed in data/ would roll the site back). Catastrophic data failures also stop push deployments.
name: Deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *' # every 30 min, away from :00 and :30 (busiest for GitHub's scheduler)
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # a stuck scrape mustn't hold up the next runs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh data
        id: refresh
        run: node scrape.mjs
        env:
          SPEED_COMPARISON_PATH: ${{ runner.temp }}/aimf-speed-comparison.json
          GITHUB_TOKEN: ${{ github.token }} # for the commit dates of benchmarks hosted on GitHub
      - name: Assemble site
        if: steps.refresh.outputs.deploy == 'true'
        run: |
          mkdir -p _site/data
          cp index.html aa-data.js _site/
          cp data/models.js data/external.js _site/data/
      - uses: actions/configure-pages@v5
        if: steps.refresh.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.refresh.outputs.deploy == 'true'
        with:
          path: _site
      - id: deployment
        if: steps.refresh.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      - name: Check speed field changes after deployment
        if: steps.refresh.outputs.deploy == 'true'
        run: node speed-health.mjs
        env:
          SPEED_COMPARISON_PATH: ${{ runner.temp }}/aimf-speed-comparison.json
